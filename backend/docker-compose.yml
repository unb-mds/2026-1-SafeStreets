# versao docker-compose
version: '3.8'

services:
  # Contêiner 1: Banco de Dados
  db:
    # Versao do postgres utilizada
    image: postgres:15-alpine
    container_name: safestreets_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: safestreets
    ports:
      # porta padrao do postgres
      - "5432:5432"
    volumes:
      # onde o volume docker sera armazenado
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d safestreets"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Contêiner 2: Backend FastAPI
  api:
    build: .
    container_name: safestreets_api
    environment:
      DATABASE_URL: postgresql://admin:123@db:5432/safestreets
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Aplica as migrations (cria as tabelas) antes de subir o servidor.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # Contêiner 3: Frontend Next.js
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: safestreets_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
    volumes:
      - ../frontend:/app
      - /app/node_modules

  # Contêiner 4 (one-shot): dispara a ingestão assim que a API responde, para
  # o mapa já abrir com dados. É idempotente (dedup por URL) e roda uma única
  # vez por "up" (restart: no). Remova este serviço se não quiser auto-popular.
  ingest:
    image: curlimages/curl:latest
    container_name: safestreets_ingest
    depends_on:
      - api
    command: >
      sh -c "until curl -sf -X POST http://api:8000/admin/ingerir;
             do echo 'aguardando a API subir...'; sleep 3; done;
             echo 'ingestao disparada com sucesso.'"
    restart: "no"

# criacao do volume para o banco de dados
volumes:
  postgres_data: